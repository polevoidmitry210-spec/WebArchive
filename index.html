<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebArchive</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:28px 20px 60px;background:#fff;color:#000;font-family:"Times New Roman",Times,Georgia,serif}
.container{max-width:780px;margin:0 auto}
.brand-title{text-align:center;font-size:34px;font-weight:500;margin:0 0 24px;line-height:1.1}
.brand-green{color:#16a316}
.top-bar{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.choose-btn{flex:1;min-width:0;height:76px;background:#fff;border:2px solid #111;border-radius:20px;padding:12px 20px;font-family:inherit;font-size:25px;color:#000;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fileInput{display:none}
.gloss-btn,.dl-link,.mini-del-btn{color:#fff;cursor:pointer;position:relative;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.55);transition:transform .08s,filter .12s;flex-shrink:0}
.gloss-btn::before,.dl-link::before,.mini-del-btn::before,.progress-fill::before{content:"";position:absolute;top:2px;left:4px;right:4px;height:44%;border-radius:10px 10px 18px 18px;background:linear-gradient(to bottom,rgba(255,255,255,.72),rgba(255,255,255,.14));pointer-events:none}
.gloss-btn:hover,.dl-link:hover,.mini-del-btn:hover{filter:brightness(1.06)}
.gloss-btn:active,.dl-link:active,.mini-del-btn:active{transform:scale(.97);filter:brightness(.95)}
.gloss-btn{min-width:118px;height:76px;padding:0 20px;border-radius:20px;font-family:inherit;font-size:23px}
.upload-btn,.dl-link{background:linear-gradient(to bottom,#47c427 0%,#1fa807 48%,#0d7e00 52%,#22b308 100%);border:2px solid #2b6e26;box-shadow:inset 0 1px 2px rgba(255,255,255,.85),inset 0 -2px 4px rgba(0,50,0,.5),0 2px 5px rgba(0,0,0,.16)}
.cancel-btn,.mini-del-btn{background:linear-gradient(to bottom,#e64538 0%,#cc1d12 48%,#9e0c04 52%,#d42317 100%);border:2px solid #7d241e;box-shadow:inset 0 1px 2px rgba(255,255,255,.8),inset 0 -2px 4px rgba(60,0,0,.5),0 2px 5px rgba(0,0,0,.16)}
.name-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.name-input{flex:1;min-width:0;height:44px;padding:6px 16px;border:2px solid #111;border-radius:16px;font-family:inherit;font-size:20px;outline:none}
.progress-line{display:flex;align-items:center;gap:14px;margin-bottom:20px;min-height:36px}
.progress-track{flex:1;height:34px;border-radius:11px;background:#fff;border:2px solid #111;overflow:hidden}
.progress-fill{height:100%;width:0%;position:relative;border-radius:9px;background:linear-gradient(to bottom,#47c427 0%,#1fa807 48%,#0d7e00 52%,#22b308 100%);box-shadow:inset 0 1px 2px rgba(255,255,255,.85),inset 0 -2px 4px rgba(0,50,0,.5);transition:width .12s}
.progress-text{font-size:22px;white-space:nowrap}
.archive-box{border:2px solid #111;border-radius:28px;background:#fff;min-height:220px;padding:22px 24px}
.archive-heading{text-align:center;font-size:25px;font-weight:400;margin:0 0 16px}
.search-wrap{display:flex;gap:10px;margin-bottom:18px}
.search-input{flex:1;min-width:0;height:44px;padding:6px 16px;border:2px solid #111;border-radius:16px;font-family:inherit;font-size:20px;outline:none}
.search-clear-btn{height:44px;padding:0 14px;border-radius:14px;border:1.5px solid #222;background:#f5f5f5;font-family:inherit;font-size:18px;cursor:pointer}
.file-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;border:1.5px solid #222;border-radius:14px;margin-bottom:12px;background:#fcfcfc}
.file-row:last-child{margin-bottom:0}
.file-name{font-size:19px;font-weight:600;word-break:break-word}
.file-meta{font-size:15px;color:#444;margin-top:3px}
.file-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.dl-link{display:inline-flex;align-items:center;padding:8px 16px;border-radius:12px;text-decoration:none;font-size:17px}
.mini-del-btn{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:36px;padding:0 11px;border-radius:12px;font-size:17px}
@media(max-width:640px){.top-bar{flex-direction:column;align-items:stretch}.choose-btn{height:62px;font-size:21px}.gloss-btn{height:58px;font-size:20px}.file-row{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="container">
  <h1 class="brand-title"><span class="brand-green">Web</span>Archive</h1>
  <div class="top-bar">
    <button type="button" class="choose-btn" id="chooseBtn" onclick="fileInput.click()">Choose file...</button>
    <input type="file" id="fileInput">
    <button type="button" class="gloss-btn upload-btn" onclick="uploadFile()">Upload</button>
    <button type="button" class="gloss-btn cancel-btn" onclick="cancelUpload()">Cancel</button>
  </div>
  <div class="name-row">
    <input type="text" class="name-input" id="customNameInput" placeholder="Название файла при загрузке (необязательно)...">
  </div>
  <div class="progress-line">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-text" id="progressText">0%</span>
  </div>
  <div class="archive-box">
    <h2 class="archive-heading">Uploaded files:</h2>
    <div class="search-wrap">
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск по ключевому слову..." oninput="filterFiles()">
      <button type="button" class="search-clear-btn" onclick="clearSearch()">✕</button>
    </div>
    <div id="filesList">
      {% for f in files %}
      <div class="file-row">
        <div>
          <div class="file-name">{{ f.name }}</div>
          <div class="file-meta">Размер: {{ f.size }} | Дата: {{ f.date or f.uploaded_at or '—' }} | Скачиваний: {{ f.downloads }} | Код: {{ f.id }}</div>
        </div>
        <div class="file-actions">
          <a class="dl-link" href="/d/{{ f.id }}">Скачать</a>
          <button type="button" class="mini-del-btn" onclick="deleteFile('{{ f.id }}')">✕</button>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
<script>
let xhr=null,sel=null;
const setBar=(w,t)=>{progressFill.style.width=w;progressText.textContent=t};
const reset=()=>{sel=null;fileInput.value='';customNameInput.value='';chooseBtn.textContent='Choose file...';setBar('0%','0%')};
function filterFiles(){const q=searchInput.value.trim().toLowerCase().split(/\s+/).filter(Boolean);filesList.querySelectorAll('.file-row').forEach(r=>{r.style.display=q.every(w=>r.textContent.toLowerCase().includes(w))?'':'none'})}
function clearSearch(){searchInput.value='';filterFiles();searchInput.focus()}
fileInput.onchange=()=>{if(xhr){xhr.abort();xhr=null}sel=fileInput.files?.[0]||null;if(sel){chooseBtn.textContent=sel.name;if(!customNameInput.value)customNameInput.value=sel.name;setBar('0%','0%')}else reset()};
function getFinalName(f){const v=customNameInput.value.trim();if(!v)return f.name;const dot=f.name.lastIndexOf('.');const ext=dot>0?f.name.slice(dot):'';return(ext&&!v.toLowerCase().endsWith(ext.toLowerCase()))?v+ext:v}
function uploadFile(){if(xhr)return;const f=fileInput.files?.[0]||sel;if(!f)return alert('Сначала выбери файл через Choose file...');const finalName=getFinalName(f);const fd=new FormData();fd.append('file',f,finalName);fd.append('name',finalName);fd.append('custom_name',finalName);setBar('0%','0%');xhr=new XMLHttpRequest();xhr.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);setBar(p+'%',p+'%')}};xhr.onload=e=>{xhr=null;if(e.target.status>=200&&e.target.status<300){setBar('100%','100%');setTimeout(()=>location.reload(),150)}else alert('Ошибка загрузки')};xhr.onerror=()=>{xhr=null;alert('Ошибка сети')};xhr.onabort=()=>{xhr=null;reset()};xhr.open('POST','/upload');xhr.send(fd)}
function cancelUpload(){xhr?xhr.abort():reset()}
function deleteFile(id){const p=prompt('Пароль админа:');if(!p)return;fetch('/delete/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})}).then(r=>r.json().then(d=>({s:r.status,d}))).then(({s,d})=>s===200?location.reload():alert(d.error))}
</script>
</body>
</html>
